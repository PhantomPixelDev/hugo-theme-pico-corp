name = "Pico Corp"
license = "MIT"
licenselink = "https://github.com/PhantomPixelDev/hugo-theme-pico-corp/blob/main/LICENSE"
description = "A minimal, premium corporate and agency theme built on Pico CSS 2. Editorial typography from the system serif stack with monospaced metadata, composable page sections, a case-study system, services, a journal and a contact form. Light and dark schemes, WCAG 2.2 AA in mind, one stylesheet and under 2 KB of vanilla JavaScript. No build step, no framework, no webfont requests."
homepage = "https://github.com/PhantomPixelDev/hugo-theme-pico-corp"
