- title: Small team, senior only
  icon: users
  text: >-
    Every person on your project has shipped production work for a decade or
    more. Nothing is handed to a junior once the contract is signed.
- title: Evidence over opinion
  icon: chart
  text: >-
    We instrument before we redesign. Decisions reference analytics, support
    tickets and user sessions rather than taste.
- title: Plain language
  icon: check-circle
  text: >-
    No jargon in status updates, no surprise invoices, and a written summary
    after every workshop so decisions are traceable.
- title: Built to be handed over
  icon: shield
  text: >-
    You get documented code, a design system your team can extend and a
    maintenance plan. Lock-in is not a business model we like.
