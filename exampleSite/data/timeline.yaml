- year: 2014
  title: Founded as a two-person studio
  text: >-
    Marta and Ruben leave a large agency to build software for mid-sized German
    industrial firms, working out of a shared studio in Kreuzberg.
- year: 2017
  title: First platform engagement
  text: >-
    Atlas Logistics asks for a dispatcher tool rather than a website. The team
    grows to five and adds dedicated backend engineering.
- year: 2020
  title: Design systems practice
  text: >-
    Remote work pushes clients toward shared component libraries. We formalise
    the design system practice that now underpins most engagements.
- year: 2023
  title: Performance and accessibility as contract terms
  text: >-
    We start writing Core Web Vitals and WCAG conformance into statements of
    work, with budgets enforced in continuous integration.
- year: 2026
  title: Nine specialists, two studios
  text: >-
    Berlin and Lisbon, one delivery team. Still no account managers between you
    and the people doing the work.
