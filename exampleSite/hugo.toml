# ---------------------------------------------------------------------------
# Theme parameters
# ---------------------------------------------------------------------------

# Sub-tables such as [params.address] must come after every plain key in
# [params]: in TOML a table header captures all following keys until the next
# header, so a key written below [params.address] becomes params.address.<key>
# and the theme never sees it.
[params]
  description = 'Northstar Digital is a Berlin product studio building websites, software and brand systems for companies that need to move quickly without lowering the bar.'

  # Company details. Nothing company-specific is hardcoded in the templates.
  companyName = 'Northstar Digital'
  legalName = 'Northstar Digital GmbH'
  tagline = 'Product studio for considered digital work'
  founded = 2014
  email = 'hello@northstar.example'
  phone = '+49 30 5550 1847'
  phoneHref = '+493055501847'
  vatId = 'DE 312 998 471'
  openingHours = 'Monday to Friday, 09:00–18:00 CET'

  # Brand. primaryColor drives the generated brand stylesheet; primaryColorDark
  # is used when the dark scheme is active.
  primaryColor = '#0f4c81'
  primaryColorDark = '#8cc0ea'
  radius = '0.5rem'
  # Display face for headings, statistics and pull quotes. 'serif' uses the
  # best serif already installed on the reader's system, which is what gives
  # the theme its editorial feel at zero network cost. 'sans' opts out.
  headingFont = 'serif'
  logo = ''            # path under assets/, e.g. 'images/logo.svg'. Empty = wordmark.
  logoDark = ''
  favicon = '/favicon.svg'
  appleTouchIcon = '/apple-touch-icon.png'
  ogImage = 'images/og-default.png'      # the share card, same art as the repo's social preview

  # Colour scheme: 'system', 'light' or 'dark'.
  defaultScheme = 'system'
  showSchemeToggle = true

  showBreadcrumbs = true
  showReadingTime = true
  showRelated = true

  [params.address]
    street = 'Chausseestraße 42'
    postalCode = '10115'
    city = 'Berlin'
    region = 'Berlin'
    country = 'Germany'
    countryCode = 'DE'
    mapURL = 'https://www.openstreetmap.org/search?query=Chausseestrasse%2042%2C%2010115%20Berlin'

  [params.announcement]
    enabled = true
    text = 'We have two delivery slots open for Q2 2026.'
    linkLabel = 'Start a project'
    linkURL = '/contact/'

  # Site-wide fallback for the closing call to action.
  [params.cta]
    eyebrow = 'Next step'
    title = 'Tell us what you are building'
    text = 'A 30 minute call is usually enough to tell whether we are the right studio for the problem. No pitch deck, no obligation.'
    primaryLabel = 'Book an intro call'
    primaryURL = '/contact/'
    secondaryLabel = 'See our work'
    secondaryURL = '/work/'

  [params.footer]
    text = 'A small senior team in Berlin. We design, build and maintain digital products for companies that care about the details.'
    note = 'Demo photography by Lorem Picsum. Replace it before launch.'

  [params.seo]
    titleSeparator = '·'
    twitterSite = '@northstardigital'
    twitterCreator = '@northstardigital'
    # Types: Organization, LocalBusiness, ProfessionalService …
    organizationType = 'ProfessionalService'

  # Leave both empty to ship zero third-party requests.
  [params.analytics]
    plausibleDomain = ''
    googleAnalyticsID = ''

  # Point action at Formspree, Netlify Forms or your own endpoint.
  [params.contactForm]
    action = ''
    method = 'POST'
    netlify = false
    successMessage = 'Thanks — we reply to every enquiry within one working day.'

  [[params.social]]
    name = 'LinkedIn'
    icon = 'linkedin'
    url = 'https://www.linkedin.com/company/example'
  [[params.social]]
    name = 'GitHub'
    icon = 'github'
    url = 'https://github.com/example'
  [[params.social]]
    name = 'Mastodon'
    icon = 'mastodon'
    url = 'https://mastodon.social/@example'
  [[params.social]]
    name = 'RSS'
    icon = 'rss'
    url = '/index.xml'
