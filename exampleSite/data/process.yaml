- title: Discovery
  text: >-
    Two weeks of interviews, analytics review and a technical audit. You leave
    with a written problem statement and a prioritised scope.
  duration: 1–2 weeks
- title: Design
  text: >-
    Wireframes, then a component-level design system. We prototype the three
    journeys that carry the business case before anything is built.
  duration: 2–4 weeks
- title: Build
  text: >-
    Two-week increments on a staging URL you can use from day one. Accessibility
    and performance budgets are checked in CI, not at the end.
  duration: 6–14 weeks
- title: Launch and iterate
  text: >-
    Migration, monitoring and a four-week hardening window. Then a quarterly
    review of what the data says to change next.
  duration: Ongoing
