# Engagement models rather than a price list. Ranges are indicative and are
# meant to disqualify poor fits early.
- name: Discovery sprint
  price: "€9,500"
  unit: fixed fee
  text: >-
    Two weeks to establish whether the thing you want to build is the thing
    you need. Ends with a written scope you can take to any studio.
  features:
    - Stakeholder and user interviews
    - Analytics and technical audit
    - Prioritised scope with effort ranges
    - Written recommendation and risks
  cta:
    label: Book a discovery sprint
    url: /contact/
- name: Project delivery
  price: "€45k–€160k"
  unit: typical range
  text: >-
    Design and build of a website, platform or product, delivered in two-week
    increments with a fixed team and a named lead.
  featured: true
  badge: Most common
  features:
    - Dedicated senior team
    - Design system and documented code
    - Performance and accessibility budgets in CI
    - Staging environment from week one
    - Four-week hardening window after launch
  cta:
    label: Discuss a project
    url: /contact/
- name: Retained partnership
  price: "€7,200"
  unit: per month
  text: >-
    A standing allocation of design and engineering time for teams that ship
    continuously. Cancel with 30 days notice.
  features:
    - Fixed monthly capacity
    - Quarterly roadmap review
    - Monitoring and dependency upkeep
    - Priority response within one working day
  cta:
    label: Ask about retainers
    url: /contact/
