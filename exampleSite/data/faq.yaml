# `group` lets a page show a subset: {{< faq group="pricing" >}} or a faq
# section with `group: pricing`.
- group: general
  question: How quickly can you start?
  answer: >-
    Discovery work usually starts within two to three weeks. Full delivery teams
    are planned a quarter ahead, so a summer start is typically agreed in spring.
- group: general
  question: Do you work with in-house teams?
  answer: >-
    Often. Roughly half of our engagements are mixed teams where we provide
    design and frontend while your engineers own the backend. We work in your
    repository, your review process and your tracker.
- group: general
  question: Which industries do you know well?
  answer: >-
    Energy, healthcare, logistics and industrial manufacturing, plus a long tail
    of professional services. If your domain is regulated or your users are not
    consumers, we have probably worked next to it.
- group: general
  question: Are you a website studio or a software studio?
  answer: >-
    Both, and the distinction matters less every year. Roughly half our revenue
    is marketing sites and half is internal tooling and customer platforms.
- group: pricing
  question: Why do you publish ranges instead of fixed prices?
  answer: >-
    Because scope decides cost. The ranges exist so you can tell within a minute
    whether we are plausible for your budget. After a discovery sprint you get a
    fixed price for the build.
- group: pricing
  question: What does a retainer actually include?
  answer: >-
    A fixed capacity of senior design and engineering time each month, a named
    lead, dependency and security upkeep, and a quarterly review of what the
    data suggests changing. Unused time does not roll over.
- group: process
  question: Who owns the code and the designs?
  answer: >-
    You do, from the first commit. Repositories live in your organisation where
    possible, and design files are transferred at the end of each phase.
- group: process
  question: How do you handle accessibility?
  answer: >-
    WCAG 2.2 AA is written into the statement of work. We test with keyboard and
    screen reader during development, and automated checks run in continuous
    integration so regressions fail the build.
- group: process
  question: What happens after launch?
  answer: >-
    A four-week hardening window is included in every project: monitoring,
    bug fixes and the small changes that only surface under real traffic. After
    that you can move to a retainer or take it in-house.
- group: contact
  question: What should I send with a first enquiry?
  answer: >-
    A paragraph on the problem, who it affects, any deadline that is real, and a
    budget range. That is enough for us to say yes, no, or ask two questions.
- group: contact
  question: Do you sign NDAs?
  answer: >-
    Yes, before any detail is shared. Send yours or use ours.
